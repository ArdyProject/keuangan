<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Keuangan Rahasia</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: 'Courier New', Courier, monospace;
      padding: 15px;
    }
    a, .btn-link {
      color: #58a6ff;
      text-decoration: underline;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
    }
    .header { text-align: center; margin-bottom: 20px; }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 15px;
    }
    .grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
    @media (min-width: 768px) {
      .grid { grid-template-columns: 1fr 2fr; }
    }
    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block;
      margin-bottom: 4px;
      color: #8b949e;
      font-size: 12px;
    }
    .form-control {
      width: 100%;
      padding: 8px;
      background: #0d1117;
      border: 1px solid #30363d;
      color: #f0f6fc;
      font-family: inherit;
      border-radius: 4px;
    }
    .btn {
      width: 100%;
      padding: 10px;
      background: transparent;
      border: 1px solid #2ea043;
      color: #3fb950;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
    }
    .btn:hover { background: #2ea043; color: #fff; }
    .btn:disabled { opacity: .6; cursor: wait; }
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { border-bottom: 1px solid #30363d; padding: 8px; font-size: 13px; }
    th { color: #8b949e; }
    .badge {
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #30363d;
      background: #000;
      display: inline-block;
    }
    .text-in { color: #3fb950; font-weight: bold; }
    .text-out { color: #f85149; font-weight: bold; }
    .text-info { color: #58a6ff; }
    .sidebar {
      position: fixed;
      top: 0;
      right: -100%;
      width: 100%;
      max-width: 400px;
      height: 100%;
      background: #000;
      border-left: 2px solid #2ea043;
      z-index: 1000;
      transition: right 0.3s ease;
      padding: 20px;
      box-shadow: -5px 0 15px rgba(0,0,0,0.5);
      overflow-y: auto;
    }
    .sidebar.open { right: 0; }
    .fab {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #000;
      color: #3fb950;
      border: 1px solid #3fb950;
      padding: 12px 20px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,255,0,0.2);
      font-family: inherit;
      z-index: 999;
    }
  </style>
</head>
<body>
  <button class="fab" onclick="toggleSidebar(true)">>_ CONVERTER</button>

  <div class="header">
    <h3 class="text-info">~ $ ./dashboard_sheets.sh</h3>
    <div class="card" style="margin-top: 10px;">
      <span style="color:#8b949e; font-size: 12px;">TOTAL SALDO AKTIF</span>
      <h2 id="totalSaldo" class="text-info" style="margin-top: 5px;">LOAD...</h2>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <div style="color:#3fb950; margin-bottom: 10px;">$ Tambah_Transaksi</div>
      <form id="formTransaksi" onsubmit="tambahData(event)">
        <div class="form-group">
          <label for="tgl">Tanggal</label>
          <input type="date" id="tgl" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="jenis">Jenis Transaksi</label>
          <select id="jenis" class="form-control" required>
            <option value="+">[+] Pemasukan</option>
            <option value="-">[-] Pengeluaran</option>
          </select>
        </div>
        <div class="form-group">
          <label for="nominal">Nominal (Rp)</label>
          <input type="number" id="nominal" class="form-control" placeholder="150000" min="1" step="1" required>
        </div>
        <div class="form-group">
          <label for="keterangan">Keterangan</label>
          <input type="text" id="keterangan" class="form-control" placeholder="Gaji / Makan" required autocomplete="off">
        </div>
        <button type="submit" id="btnSubmit" class="btn">Simpan ke Sheets</button>
      </form>
    </div>

    <div class="card">
      <div style="color:#3fb950; margin-bottom: 10px;">$ Log_Keuangan</div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Tgl</th>
              <th>Ket</th>
              <th>+/-</th>
              <th>Nilai Kode</th>
              <th>Saldo</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="tabelBody">
            <tr><td colspan="6" style="text-align: center; color: #8b949e;">Mengambil data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="sidebar" class="sidebar">
    <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
      <span style="color:#3fb950;">~ $ /converter.sh</span>
      <button class="btn-link" onclick="toggleSidebar(false)">[X] Tutup</button>
    </div>
    <div style="font-size: 12px; color: #58a6ff; margin-bottom: 15px;">
      a=0 b=1 c=2 d=3 e=4 f=5 g=6 h=7 i=8 j=9<br>
      Rule: 000 = A³, 1111 = B⁴
    </div>
    <div class="form-group">
      <label for="cAngka">Nominal Angka (Rp):</label>
      <input type="number" id="cAngka" class="form-control" placeholder="150000">
      <button class="btn-link" onclick="cEnkrip()" style="margin-top: 5px;">[Enter] Enkripsi</button>
    </div>
    <div class="form-group" style="margin-top: 20px;">
      <label for="cKode">Kode Rahasia:</label>
      <input type="text" id="cKode" class="form-control" placeholder="B.F⁵">
      <button class="btn-link" onclick="cDekrip()" style="margin-top: 5px;">[Enter] Dekripsi</button>
    </div>
    <div id="cHasilBox" style="display:none; margin-top: 20px; padding: 10px; border: 1px solid #3fb950;">
      <span style="color:#3fb950;">Hasil:</span>
      <div id="cHasil" style="font-size: 16px; font-weight: bold; margin: 5px 0;"></div>
    </div>
  </div>

  <script>
    // Ganti dengan URL deployment Apps Script yang berakhiran /exec.
    const API_URL = 'https://script.google.com/macros/s/AKfycbyC3wepIea0VDfmSKJZOtrOKWRbiBAaKNObbhAshvKZZRbupcm3NIo3t6RyeJ-YX3F32A/exec';

    const kodeAngka = {'0':'a','1':'b','2':'c','3':'d','4':'e','5':'f','6':'g','7':'h','8':'i','9':'j'};
    const kodeHuruf = {'a':'0','b':'1','c':'2','d':'3','e':'4','f':'5','g':'6','h':'7','i':'8','j':'9'};
    const superToNum = {'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9'};
    const numToSuper = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};

    document.getElementById('tgl').value = new Date().toISOString().slice(0, 10);

    function enkripsiAngka(angka) {
      let str = String(angka ?? '').replace(/[^0-9]/g, '');
      if (!str) return '0';
      const kode = str.split('').map(d => kodeAngka[d]).join('');
      let hasil = '';
      let count = 1;
      for (let i = 0; i < kode.length; i++) {
        if (kode[i] === kode[i + 1]) {
          count++;
        } else {
          hasil += kode[i].toUpperCase();
          if (count > 1) {
            for (const digit of String(count)) hasil += numToSuper[digit];
          }
          count = 1;
        }
      }
      return hasil.replace(/(.{1,3})/g, '$1.').replace(/\.$/, '');
    }

    function dekripsiKode(kode) {
      kode = String(kode ?? '').toLowerCase().replace(/\./g, '');
      let angka = '';
      for (let i = 0; i < kode.length; i++) {
        const huruf = kode[i];
        if (kodeHuruf[huruf] === undefined) continue;
        let jumlah = 1;
        const nextChar = kode[i + 1];
        if (superToNum[nextChar] !== undefined) {
          jumlah = parseInt(superToNum[nextChar], 10);
          i++;
        }
        angka += kodeHuruf[huruf].repeat(jumlah);
      }
      return angka;
    }

    function normalizeJenisClient(value) {
      const jenis = String(value ?? '').trim().toLowerCase();
      if (['+', 'pemasukan', 'masuk', 'income', 'in', 'debit'].includes(jenis)) return '+';
      if (['-', 'pengeluaran', 'keluar', 'expense', 'out', 'kredit'].includes(jenis)) return '-';
      return '';
    }

    function parseNominalClient(value) {
      if (typeof value === 'number') return Number.isFinite(value) ? value : 0;
      let text = String(value ?? '').replace(/Rp/gi, '').replace(/\s/g, '');
      if (!text) return 0;
      if (text.includes(',')) {
        text = text.replace(/\./g, '').replace(',', '.');
      } else {
        text = text.replace(/\./g, '');
      }
      const number = Number(text.replace(/[^0-9.-]/g, ''));
      return Number.isFinite(number) ? number : 0;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    async function apiRequest(options = {}) {
      const response = await fetch(API_URL, {
        method: options.method || 'GET',
        // Jangan menambahkan Content-Type application/json agar tidak memicu
        // preflight CORS pada hosting tertentu.
        body: options.body ? JSON.stringify(options.body) : undefined,
        cache: 'no-store'
      });

      const text = await response.text();
      let result;
      try {
        result = JSON.parse(text);
      } catch (_) {
        throw new Error('API tidak mengembalikan JSON. Pastikan URL memakai /exec dan akses deployment adalah Anyone.');
      }

      if (!response.ok || (result && result.status === 'error')) {
        throw new Error(result.message || `HTTP ${response.status}`);
      }
      return result;
    }

    async function loadData() {
      const body = document.getElementById('tabelBody');
      try {
        const result = await apiRequest();
        if (!Array.isArray(result)) {
          throw new Error(result.message || 'Format data API tidak valid.');
        }

        result.sort((a, b) => {
          const dateCompare = String(a.tanggal ?? '').localeCompare(String(b.tanggal ?? ''));
          return dateCompare || String(a.id ?? '').localeCompare(String(b.id ?? ''));
        });

        let saldo = 0;
        const dataRender = result.map(item => {
          const jenis = normalizeJenisClient(item.jenis);
          const nominal = parseNominalClient(item.nominal);

          // Hanya '-' yang mengurangi saldo.
          if (jenis === '+') saldo += nominal;
          if (jenis === '-') saldo -= nominal;

          return { ...item, jenis, nominal, saldoBerjalan: saldo };
        }).reverse();

        document.getElementById('totalSaldo').innerText =
          enkripsiAngka(Math.abs(saldo)) + (saldo < 0 ? ' (MINUS)' : '');

        if (!dataRender.length) {
          body.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#8b949e">Belum ada data.</td></tr>';
          return;
        }

        body.innerHTML = dataRender.map(item => `
          <tr>
            <td style="color:#8b949e">${escapeHtml(String(item.tanggal ?? '').substring(2))}</td>
            <td>${escapeHtml(item.keterangan)}</td>
            <td class="${item.jenis === '+' ? 'text-in' : 'text-out'}">
              ${item.jenis === '+' ? '[IN]' : item.jenis === '-' ? '[OUT]' : '[?]'}
            </td>
            <td><span class="badge ${item.jenis === '+' ? 'text-in' : 'text-out'}">${enkripsiAngka(item.nominal)}</span></td>
            <td><span class="badge text-info">${enkripsiAngka(Math.abs(item.saldoBerjalan))}</span></td>
            <td>
              <button class="btn-link" style="color:#f85149" data-id="${escapeHtml(item.id)}">Del</button>
            </td>
          </tr>
        `).join('');

        body.querySelectorAll('button[data-id]').forEach(button => {
          button.addEventListener('click', () => hapusData(button.dataset.id));
        });
      } catch (error) {
        console.error('loadData error:', error);
        body.innerHTML = `<tr><td colspan="6" style="text-align:center;color:#f85149">${escapeHtml(error.message)}</td></tr>`;
      }
    }

    async function tambahData(event) {
      event.preventDefault();
      const button = document.getElementById('btnSubmit');
      button.innerText = 'Mengirim...';
      button.disabled = true;

      try {
        await apiRequest({
          method: 'POST',
          body: {
            action: 'add',
            tanggal: document.getElementById('tgl').value,
            jenis: normalizeJenisClient(document.getElementById('jenis').value),
            nominal: document.getElementById('nominal').value,
            keterangan: document.getElementById('keterangan').value
          }
        });

        document.getElementById('nominal').value = '';
        document.getElementById('keterangan').value = '';
        await loadData();
      } catch (error) {
        console.error('tambahData error:', error);
        alert('Gagal menyimpan: ' + error.message);
      } finally {
        button.innerText = 'Simpan ke Sheets';
        button.disabled = false;
      }
    }

    async function hapusData(id) {
      if (!confirm('Hapus transaksi ini?')) return;

      try {
        await apiRequest({
          method: 'POST',
          body: { action: 'delete', id: id }
        });
        await loadData();
      } catch (error) {
        console.error('hapusData error:', error);
        alert('Gagal menghapus: ' + error.message);
      }
    }

    function toggleSidebar(show) {
      document.getElementById('sidebar').classList.toggle('open', show);
    }

    function cEnkrip() {
      const value = document.getElementById('cAngka').value;
      if (!value) return;
      document.getElementById('cHasil').innerText = enkripsiAngka(value);
      document.getElementById('cHasilBox').style.display = 'block';
    }

    function cDekrip() {
      const value = document.getElementById('cKode').value;
      if (!value) return;
      const result = dekripsiKode(value);
      document.getElementById('cHasil').innerText = 'Rp ' + result.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      document.getElementById('cHasilBox').style.display = 'block';
    }

    loadData();
  </script>
</body>
</html>
